<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width,
        initial-scale=1.0,
        maximum-scale=1.0,
        user-scalable=no,
        viewport-fit=cover">

    <meta name="theme-color" content="#12030a">
    <meta name="apple-mobile-web-app-capable" content="yes">

    <title>Maze - Levels</title>

    <link rel="stylesheet" href="main.css">
</head>

<body>

    <div id="menu"></div>

    <button id="toggle3D" type="button">
        Toggle 3D
    </button>

    <canvas id="c" width="500" height="500"></canvas>

    <div id="win" onclick="backToMenu()">
        LEVEL COMPLETE 🌟<br>
        <span style="font-size:18px;">Click to return</span>
    </div>

    <script src="main.js"></script>

    <script>
        // Prevent gesture/pinch zoom
        document.addEventListener('gesturestart', function (e) {
            e.preventDefault();
        });

        document.addEventListener('gesturechange', function (e) {
            e.preventDefault();
        });

        document.addEventListener('gestureend', function (e) {
            e.preventDefault();
        });

        // Prevent Ctrl + mouse-wheel zoom
        document.addEventListener('wheel', function (e) {
            if (e.ctrlKey) {
                e.preventDefault();
            }
        }, {
            passive: false
        });

        // Block right-click menu
        document.addEventListener('contextmenu', function (e) {
            e.preventDefault();
        });

        // Block copy / cut / paste
        document.addEventListener('copy', function (e) {
            e.preventDefault();
        });

        document.addEventListener('cut', function (e) {
            e.preventDefault();
        });

        document.addEventListener('paste', function (e) {
            e.preventDefault();
        });

        // Block text selection
        document.addEventListener('selectstart', function (e) {
            e.preventDefault();
        });

        // Block common shortcuts
        document.addEventListener('keydown', function (e) {

            if (
                e.ctrlKey && (
                    e.key.toLowerCase() === 'c' ||
                    e.key.toLowerCase() === 'v' ||
                    e.key.toLowerCase() === 'x' ||
                    e.key.toLowerCase() === 'a' ||
                    e.key.toLowerCase() === 'u' ||
                    e.key.toLowerCase() === 's'
                )
            ) {
                e.preventDefault();
            }

            // Block F12
            if (e.key === 'F12') {
                e.preventDefault();
            }
        });
    </script>

</body>

</html>
